<main class="mx-auto flex min-h-screen max-w-2xl flex-col gap-6 p-6">
  <h1 class="text-2xl font-semibold text-slate-900">{{ testi.titolo }}</h1>
  <p class="text-slate-700">{{ testi.segnaposto }}</p>

  <div>
    <button
      type="button"
      class="rounded-md bg-slate-900 px-4 py-2 text-white hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900 disabled:opacity-50"
      [disabled]="inCorso()"
      (click)="verifica()"
    >
      @if (inCorso()) {
        {{ testi.verificaInCorso }}
      } @else {
        {{ testi.pulsantePing }}
      }
    </button>
  </div>

  @if (esito(); as messaggio) {
    <p role="status" class="text-emerald-700">{{ messaggio }}</p>
  }
  @if (errore(); as messaggio) {
    <p role="alert" class="text-red-700">{{ messaggio }}</p>
  }
</main>
